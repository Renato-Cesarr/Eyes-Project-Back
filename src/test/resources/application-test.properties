# Configurações para ambiente de Teste / CI usando H2 (In-memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Forçar o Hibernate a criar as tabelas nos testes para evitar erros de validação
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desativar o Flyway nos testes de contexto para isolar erros
spring.flyway.enabled=false
logging.structured.format.console=

# Segredo fixo para testes
app.jwt.secret=testing_only_secret_key_eyes_project
app.jwt.expiration-hours=1
app.cors.allowed-origins=http://localhost:4200
app.rate-limit.login.capacity=1000
app.rate-limit.login.window-seconds=60
app.rate-limit.access-request.capacity=1000
app.rate-limit.access-request.window-seconds=60
app.rate-limit.password-recovery.capacity=1000
app.rate-limit.password-recovery.window-seconds=60
