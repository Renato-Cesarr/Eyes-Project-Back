# Configurações para ambiente de Teste / CI
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eyes_project_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Forçar o Hibernate a criar as tabelas nos testes para evitar erros de validação
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desativar o Flyway nos testes de contexto para isolar erros
spring.flyway.enabled=false

# Segredo fixo para testes
app.jwt.secret=testing_only_secret_key_eyes_project
app.jwt.expiration-hours=1
