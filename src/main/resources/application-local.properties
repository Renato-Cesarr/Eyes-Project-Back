# Profile exclusivamente local. Iniciar a API após local-services.ps1 -Action start.
# Importação obrigatória; não reutilizar este arquivo/profile em produção.
spring.config.import=file:./.env[.properties]
server.address=127.0.0.1
spring.datasource.url=jdbc:postgresql://127.0.0.1:${DB_PORT:55432}/eyes_local
spring.datasource.username=eyes_local
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET}
spring.mail.host=127.0.0.1
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
