spring.application.name=eyes-project-back
server.port=${PORT:8080}

# Database Config
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eyes_project_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Config
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Flyway Config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Custom App Config
app.jwt.secret=${JWT_SECRET:super_secret_for_local_only}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
app.access-requests.rate-limit.max-requests=${ACCESS_REQUEST_RATE_LIMIT_MAX:5}
app.access-requests.rate-limit.window-seconds=${ACCESS_REQUEST_RATE_LIMIT_WINDOW_SECONDS:900}

# Optional, one-time bootstrap for the first administrator. Keep disabled after provisioning.
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Mail Config
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
