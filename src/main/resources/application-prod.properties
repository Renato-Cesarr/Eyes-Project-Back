spring.datasource.url=jdbc:postgresql:///${DB_NAME:eyes}?cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlRefreshStrategy=lazy&sslmode=disable
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

app.jwt.secret=${JWT_SECRET}
app.frontend.url=${FRONTEND_URL}
app.cors.allowed-origins=${FRONTEND_URL}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=8s
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
