name: CI Back-End

on:
  pull_request:
    branches: [ "dev" ]
  push:
    branches: [ "dev" ]

jobs:
  build:
    name: Build + Test + Sonar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Dar permissão ao Maven
        run: chmod +x ./mvnw

      - name: Build + Testes
        run: ./mvnw clean verify

      - name: Rodar SonarCloud
        run: ./mvnw sonar:sonar \
          -Dsonar.projectKey=Renato-Cesarr_Eyes-Project-Back \
          -Dsonar.organization=renato-cesarr \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
