name: CI Back-End

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + Test + Sonar
    runs-on: ubuntu-latest

    steps:
      - name: Verificar origem da promoção para main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: test "$GITHUB_HEAD_REF" = dev && test "$HEAD_REPO" = "$GITHUB_REPOSITORY"

      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Dar permissão ao Maven
        run: chmod +x ./mvnw

      - name: Validar toolchain
        shell: pwsh
        run: ./scripts/check-toolchain.ps1

      - name: Build + testes unitários e PostgreSQL
        run: ./mvnw clean verify -Dspring.profiles.active=test
        env:
          JWT_SECRET: testing_secret_key

      - name: Confirmar execução dos testes PostgreSQL
        shell: bash
        run: |
          reports=(target/surefire-reports/TEST-*PostgresIntegrationTest.xml)
          test -e "${reports[0]}"
          for report in "${reports[@]}"; do
            grep -q 'skipped="0"' "$report" || {
              echo "A suíte PostgreSQL não executou completamente: $report"
              exit 1
            }
          done

      - name: Rodar SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_WAIT: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
          -Dsonar.projectKey=Renato-Cesarr_Eyes-Project-Back \
          -Dsonar.organization=renato-cesarr \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.qualitygate.wait="$SONAR_WAIT" \
          -Dsonar.exclusions=**/*.sql \
          -Dsonar.coverage.exclusions=src/main/java/br/com/eyesproject/eyes_project_back/global/**/*,src/main/java/br/com/eyesproject/eyes_project_back/**/domain/models/*,src/main/java/br/com/eyesproject/eyes_project_back/**/presentation/dto/*

      - name: Disponibilizar JAR validado para publicação
        if: github.ref == 'refs/heads/main' && vars.GCP_DEPLOY_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eyes-api-jar
          path: target/eyes-project-back-0.0.1-SNAPSHOT.jar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publicar API no Google Cloud
    needs: build
    if: github.ref == 'refs/heads/main' && vars.GCP_DEPLOY_ENABLED == 'true'
    environment: production
    concurrency:
      group: eyes-api-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_RUN_REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410a181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: eyes-api-jar
          path: target
      - run: docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t eyes-release .
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '584.0.0'
      - name: Validar revisão antes de promover tráfego
        run: bash deploy/publish-cloud-run.sh eyes-api /actuator/health
